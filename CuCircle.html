<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CuCircle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        body {
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            min-height: 100vh;
        }

        h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
        }

        input[type="number"] {
            width: 80px;
            padding: 6px 8px;
            font-size: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #222;
            color: #fff;
            outline: none;
        }

        button {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            background: #3b82f6;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .zoom {
            display: flex;
            gap: 4px;
        }

        .zoom button {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
        }

        .canvas-container {
            border: 1px solid #2a2a2a;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .controls {
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
                max-width: 340px;
            }

            button {
                flex: 1;
                min-width: 90px;
            }

            .zoom {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <h1>THIS IS CuCircle.</h1>

    <div class="controls">
        <input type="number" id="diameter" value="16" min="2" step="1">
        <button id="generate">Generate</button>
        <button id="download">Download</button>
        <div class="zoom">
            <button id="zoomOut">−</button>
            <button id="zoomIn">+</button>
        </div>
    </div>

    <div class="canvas-container" id="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="hint">
        Drag to pan • Pinch or buttons to zoom<br>
        CuCircle,made by Bri_l2 in 2026.
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('container');

let scale = 20;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

let touchStartDist = 0;
let touchStartScale = 0;
let touchStartOffsetX = 0;
let touchStartOffsetY = 0;

function resizeCanvas() {
    const w = Math.min(760, window.innerWidth - 20);
    const h = Math.min(580, window.innerHeight - 180);
    canvas.width = w;
    canvas.height = h;
    draw();
}

function worldToScreen(x, y) {
    return {
        sx: offsetX + x * scale + canvas.width / 2,
        sy: offsetY + y * scale + canvas.height / 2
    };
}

function drawGrid() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;

    const gridStep = scale;
    const startX = Math.floor((-canvas.width / 2 - offsetX) / gridStep) - 1;
    const endX = Math.ceil((canvas.width / 2 - offsetX) / gridStep) + 1;
    const startY = Math.floor((-canvas.height / 2 - offsetY) / gridStep) - 1;
    const endY = Math.ceil((canvas.height / 2 - offsetY) / gridStep) + 1;

    for (let i = startX; i <= endX; i++) {
        const p = worldToScreen(i, 0);
        ctx.beginPath();
        ctx.moveTo(p.sx, 0);
        ctx.lineTo(p.sx, canvas.height);
        ctx.stroke();
    }

    for (let i = startY; i <= endY; i++) {
        const p = worldToScreen(0, i);
        ctx.beginPath();
        ctx.moveTo(0, p.sy);
        ctx.lineTo(canvas.width, p.sy);
        ctx.stroke();
    }

    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;

    const xAxis = worldToScreen(0, 0);
    ctx.beginPath();
    ctx.moveTo(0, xAxis.sy);
    ctx.lineTo(canvas.width, xAxis.sy);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(xAxis.sx, 0);
    ctx.lineTo(xAxis.sx, canvas.height);
    ctx.stroke();
}

function getCircleCells(diameter) {
    const r = diameter / 2;
    const cells = new Set();

    for (let y = -Math.ceil(r); y <= Math.ceil(r); y++) {
        for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) {
            const dSq = x * x + y * y;
            const rSq = r * r;

            if (Math.abs(dSq - rSq) <= r) {
                cells.add(`${x},${y}`);
            }
        }
    }

    return cells;
}

function drawCircleCells(cells) {
    ctx.fillStyle = '#3b82f680';

    cells.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        const pos = worldToScreen(x, y);
        ctx.fillRect(pos.sx, pos.sy, scale, scale);
    });
}

function draw() {
    drawGrid();
    const dia = Number(document.getElementById('diameter').value) || 16;
    const cells = getCircleCells(dia);
    drawCircleCells(cells);
}

function downloadPNG() {
    const link = document.createElement('a');
    link.download = `mc-circle-${document.getElementById('diameter').value}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
}

container.addEventListener('mousedown', e => {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
});

window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    offsetX += dx;
    offsetY += dy;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    draw();
});

window.addEventListener('mouseup', () => {
    isDragging = false;
});

container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    scale *= factor;
    scale = Math.max(5, Math.min(60, scale));
    draw();
});

container.addEventListener('touchstart', e => {
    e.preventDefault();

    if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx * dx + dy * dy);
        touchStartScale = scale;
        touchStartOffsetX = offsetX;
        touchStartOffsetY = offsetY;
    }
});

container.addEventListener('touchmove', e => {
    e.preventDefault();

    if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - dragStartX;
        const dy = e.touches[0].clientY - dragStartY;
        offsetX += dx;
        offsetY += dy;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        draw();
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        scale = touchStartScale * (dist / touchStartDist);
        scale = Math.max(5, Math.min(60, scale));
        draw();
    }
});

container.addEventListener('touchend', () => {
    isDragging = false;
});

document.getElementById('zoomIn').onclick = () => {
    scale *= 1.1;
    scale = Math.min(60, scale);
    draw();
};

document.getElementById('zoomOut').onclick = () => {
    scale *= 0.9;
    scale = Math.max(5, scale);
    draw();
};

document.getElementById('generate').addEventListener('click', draw);
document.getElementById('diameter').addEventListener('keydown', e => {
    if (e.key === 'Enter') draw();
});

document.getElementById('download').addEventListener('click', downloadPNG);

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
